upstream backend {
    server backend-api:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API 后端代理
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 防止重定向问题
        proxy_redirect off;
    }

    # Production: Block documentation endpoints
    location = /docs {
        return 404;
    }
    
    location = /redoc {
        return 404;
    }
    
    location = /openapi.json {
        return 404;
    }
    
    location /api/v1/openapi.json {
        return 404;
    }

    # 静态文件访问 - 只允许公开资源
    # 题目附件（patch、数据文件等）
    location /uploads/attachments/ {
        alias /app/data/uploads/attachments/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # 题目描述中的图片
    location /uploads/images/ {
        alias /app/data/uploads/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 禁止访问其他上传文件（用户提交、脚本、日志）
    location /uploads/ {
        return 403;
    }

    # 前端应用
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 防止重定向问题
        proxy_redirect off;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
